<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Nanobot Robot AI — 初始配置</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #17202a; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: #5d6878; margin: 0 0 22px; font-size: 13px; }
    section { background: #fff; border: 1px solid #e1e6ec; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    h2 { font-size: 14px; margin: 0 0 12px; color: #2a3a4a; }
    label { display: block; font-size: 12px; color: #5d6878; margin: 10px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9d0da; border-radius: 6px; font-size: 13px; background: #fff; }
    input:focus, select:focus { outline: none; border-color: #4a7ffe; }
    .row { display: flex; gap: 8px; align-items: stretch; }
    .row input { flex: 1; }
    .pick { padding: 8px 12px; border: 1px solid #c9d0da; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    button.primary { background: #2f6fed; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button.primary:disabled { background: #9bb4e6; cursor: default; }
    .err { color: #b42318; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nanobot Robot AI</h1>
    <p class="sub">首次启动,请填写基础配置。信息保存在本机 %APPDATA%\nanobot-robot-ai。</p>

    <section>
      <h2>AI 模型(必填)</h2>
      <label>服务商</label>
      <select id="provider">
        <option value="custom">自定义 / OpenAI 兼容</option>
        <option value="openai">OpenAI</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gemini">Gemini</option>
        <option value="anthropic">Anthropic</option>
      </select>
      <label>API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
      <label>API Base(可选,留空用服务商默认)</label>
      <input id="apiBase" type="text" placeholder="https://..." />
      <label>模型名称</label>
      <input id="model" type="text" placeholder="例如 glm-5-turbo / gpt-4o" />
    </section>

    <section>
      <h2>机械臂(可先跳过,默认仿真)</h2>
      <label>后端模式</label>
      <select id="backendMode">
        <option value="simulation">simulation(仿真,不连硬件)</option>
        <option value="zmotion_readonly">zmotion_readonly(只读,需 ZMotion DLL)</option>
      </select>
      <label>控制器地址</label>
      <input id="controllerHost" type="text" value="10.168.3.21" />
      <label>ZMotion Wrapper 路径(只读模式必填)</label>
      <div class="row"><input id="dllWrapper" type="text" placeholder="C:\path\to\wrapper" /><button class="pick" id="pickWrapper">选…</button></div>
      <label>ZMotion DLL 目录(只读模式必填)</label>
      <div class="row"><input id="dllDir" type="text" placeholder="C:\path\to\dlls" /><button class="pick" id="pickDllDir">选…</button></div>
    </section>

    <div class="err" id="err"></div>
    <div class="actions"><button class="primary" id="save">保存并启动</button></div>
  </div>
  <script src="wizard.js"></script>
</body>
</html>
