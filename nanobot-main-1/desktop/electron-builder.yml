appId: com.motionflow.ai
productName: MotionFlow AI
copyright: Copyright © 2026 MotionFlow AI
beforePack: electron/before-pack.js
afterPack: electron/after-pack.js
# 本地构建不发布到任何更新渠道（避免 CI 检测时尝试解析 repository）
publish: null

# Installer output is separate from desktop/build, which contains the compiled
# Electron main and preload scripts.
directories:
  output: release2

# Runtime has zero npm dependencies; Electron itself is injected by the builder.
files:
  - build/**/*
  - electron/config-wizard/**/*
  - electron/assets/**/*
  - electron/default-config.json
  - electron/defaults/**/*
  - package.json

# Bundle the PyInstaller onedir tree next to the app under resources/py-runtime.
# main.ts resolves it via process.resourcesPath + "py-runtime/robot_server.exe".
extraResources:
  - from: electron/defaults/robot_ai
    to: defaults/robot_platform
    filter:
      - "**/*"
  - from: pyinstaller/dist-robot-server/py-runtime
    to: py-runtime
    filter:
      - "**/*"
  # ZMotion SDK is distributed with the application. The runtime resolves
  # zauxdllPython.py and the controller DLLs under resources/vendor/zmotion.
  - from: ../vendor/zmotion
    to: vendor/zmotion
    filter:
      - "**/*"

asar: true

win:
  executableName: MotionFlow AI
  icon: electron/assets/robot-arm-app-icon.ico
  legalTrademarks: MotionFlow AI
  target:
    - target: nsis
      arch:
        - x64
  artifactName: motionflow-ai-Setup-${version}.${ext}
  # electron-builder's bundled rcedit downloader cannot unpack the macOS
  # symlinks in winCodeSign on standard Windows accounts. after-pack.js uses
  # the project's verified Windows-only rcedit binary instead.
  signAndEditExecutable: false

nsis:
  # Keep installation per-user while allowing the user to choose the folder.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: electron/installer-per-user.nsh
