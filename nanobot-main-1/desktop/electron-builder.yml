appId: com.nanobot.robotai
productName: Nanobot Robot AI
copyright: Copyright © 2026 Nanobot Robot AI
beforePack: electron/before-pack.js
afterPack: electron/after-pack.js

# Installer output is separate from desktop/build, which contains the compiled
# Electron main and preload scripts.
directories:
  output: release2

# Runtime has zero npm dependencies; Electron itself is injected by the builder.
files:
  - build/**/*
  - electron/config-wizard/**/*
  - electron/default-config.json
  - electron/defaults/**/*
  - package.json

# Bundle the PyInstaller onedir tree next to the app under resources/py-runtime.
# main.ts resolves it via process.resourcesPath + "py-runtime/nanobot_gateway.exe".
extraResources:
  - from: electron/defaults
    to: defaults
    filter:
      - "**/*"
  - from: pyinstaller/dist/py-runtime
    to: py-runtime
    filter:
      - "**/*"
  # ZMotion SDK is distributed with the application. The runtime resolves
  # zauxdllPython.py and the controller DLLs under resources/vendor/zmotion.
  - from: ../vendor/zmotion
    to: vendor/zmotion
    filter:
      - "**/*"

asar: true

win:
  executableName: Nanobot Robot AI
  icon: electron/assets/nanobot-app-icon.ico
  legalTrademarks: Nanobot Robot AI
  target:
    - target: nsis
      arch:
        - x64
  artifactName: nanobot-robot-ai-Setup-${version}.${ext}
  # electron-builder's bundled rcedit downloader cannot unpack the macOS
  # symlinks in winCodeSign on standard Windows accounts. after-pack.js uses
  # the project's verified Windows-only rcedit binary instead.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
