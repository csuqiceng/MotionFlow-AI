    <title>设置 — NanoBot 机械手智能控制系统</title>
    <style id="theme-vars">
/* ===================================================================
   NanoBot 机械手智能控制系统 — 统一设计规范 v3 (Pure Light)
   纯白精致工业风：白底 · 清晰层次 · 青蓝强调 · 合理布局
   =================================================================== */

:root {
  color-scheme: light;

  /* ---- 基础色板 (HSL) — 纯白体系 ---- */
  --background: 220 40% 99%;          /* #fbfcfd 近白底 */
  --background-elevated: 220 30% 97%; /* #f4f6f9 抬升层 */
  --foreground: 222 32% 12%;          /* #161c28 主文字 */
  --foreground-muted: 220 10% 48%;    /* #737986 次要文字 */

  --card: 0 0% 100%;                  /* #ffffff 纯白卡片 */
  --card-foreground: 222 32% 12%;

  --popover: 0 0% 100%;
  --popover-foreground: 222 32% 12%;

  /* ---- 主品牌色 (青蓝 Cyan-Teal) ---- */
  --primary: 192 72% 40%;             /* #1d9bb8 主操作色 */
  --primary-foreground: 0 0% 100%;
  --primary-hover: 192 72% 34%;
  --primary-subtle: 192 60% 94%;      /* 浅青底色 */
  --accent-primary: 192 76% 46%;      /* #25a8c6 高亮强调 */
  --accent-primary-foreground: 0 0% 100%;

  /* ---- 语义状态色 ---- */
  --success: 156 58% 38%;             /* #2da070 */
  --success-foreground: 0 0% 100%;
  --success-subtle: 156 50% 93%;
  --warning: 38 88% 44%;              /* #d99522 */
  --warning-foreground: 38 88% 12%;
  --warning-subtle: 40 80% 93%;
  --danger: 4 72% 48%;                /* #d24040 */
  --danger-foreground: 0 0% 100%;
  --danger-subtle: 4 60% 94%;
  --info: 202 80% 46%;                /* #2a8fd0 */
  --info-foreground: 0 0% 100%;
  --info-subtle: 202 60% 93%;

  /* ---- 中性层 ---- */
  --secondary: 220 20% 95%;           /* #eef1f5 次要按钮 */
  --secondary-foreground: 222 32% 12%;
  --muted: 220 20% 95%;
  --muted-foreground: 220 10% 44%;
  --accent: 192 60% 94%;
  --accent-foreground: 192 72% 28%;

  --destructive: 4 72% 44%;
  --destructive-foreground: 0 0% 98%;

  --border: 220 16% 90%;              /* #dfe4ec 边框 */
  --border-strong: 220 16% 78%;
  --input: 220 16% 90%;
  --ring: 192 72% 40%;

  --sidebar: 220 40% 98%;             /* #f7f9fb 侧边栏 */
  --sidebar-foreground: 222 32% 12%;
  --sidebar-accent: 192 60% 94%;
  --sidebar-accent-foreground: 192 72% 28%;
  --sidebar-border: 220 16% 88%;

  /* ---- 字体系统 ---- */
  --font-sans: "Inter", "system-ui", "-apple-system", "BlinkMacSystemFont",
    "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code",
    "Source Code Pro", "Consolas", monospace;

  /* 字号阶梯 */
  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-display: 2.25rem;

  /* ---- 圆角系统 ---- */
  --radius: 0.625rem;      /* 10px 默认 */
  --radius-sm: 0.375rem;   /* 6px */
  --radius-md: 0.625rem;   /* 10px */
  --radius-lg: 0.75rem;    /* 12px */
  --radius-xl: 1rem;       /* 16px */

  /* ---- 间距系统 (4px 基准) ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  /* ---- 阴影系统 — 柔和、浅色系 ---- */
  --shadow-sm: 0 1px 2px 0 rgb(15 23 42 / 0.04);
  --shadow-md: 0 2px 8px -2px rgb(15 23 42 / 0.06), 0 1px 3px -1px rgb(15 23 42 / 0.04);
  --shadow-lg: 0 8px 24px -6px rgb(15 23 42 / 0.1), 0 4px 8px -4px rgb(15 23 42 / 0.06);
  --shadow-glow: 0 2px 12px -2px hsl(var(--primary) / 0.2);
  --shadow-glow-strong: 0 4px 16px -2px hsl(var(--primary) / 0.3);
  --shadow-card: 0 1px 3px 0 rgb(15 23 42 / 0.04), 0 1px 2px -1px rgb(15 23 42 / 0.04);
  --shadow-soft: 0 1px 4px -1px rgb(15 23 42 / 0.05);

  /* ---- 滚动条 ---- */
  --scrollbar-thumb: hsl(220 10% 44% / 0.25);
  --scrollbar-thumb-hover: hsl(220 10% 44% / 0.4);
}

/* ---- 基础重置 ---- */
* {
  border-color: hsl(var(--border));
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* v3 背景：极淡的顶部辉光 + 极淡网格，保持干净 */
body {
  background-image:
    radial-gradient(ellipse 70% 40% at 50% -5%, hsl(var(--accent-primary) / 0.06), transparent),
    linear-gradient(hsl(var(--border) / 0.4) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--border) / 0.4) 1px, transparent 1px);
  background-size: 100% 100%, 64px 64px, 64px 64px;
  background-attachment: fixed;
}

/* ---- 滚动条 ---- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
*::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background-color: var(--scrollbar-thumb);
  border-radius: 9999px;
}
*::-webkit-scrollbar-thumb:hover {
  background-color: var(--scrollbar-thumb-hover);
}

::selection {
  background: hsl(var(--primary) / 0.15);
}

/* ===================================================================
   组件层 v3 — 纯白精致工业控制 UI
   =================================================================== */

/* ---- 纯白卡片 ---- */
.glass-card {
  background: hsl(0 0% 100% / 0.9);
  backdrop-filter: blur(16px) saturate(120%);
  -webkit-backdrop-filter: blur(16px) saturate(120%);
  border: 1px solid hsl(var(--border));
  box-shadow: var(--shadow-card);
  border-radius: var(--radius-lg);
}

/* ---- 柔和卡片 ---- */
.soft-card {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  box-shadow: var(--shadow-soft);
  border-radius: var(--radius-lg);
}

/* ---- 状态指示药丸 v3 — 胶囊形 ---- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.1875rem 0.625rem;
  border-radius: 9999px;
  border: 1px solid;
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}
.status-pill--ok {
  border-color: hsl(var(--success) / 0.25);
  background: hsl(var(--success-subtle));
  color: hsl(156 58% 32%);
}
.status-pill--danger {
  border-color: hsl(var(--danger) / 0.25);
  background: hsl(var(--danger-subtle));
  color: hsl(4 72% 42%);
}
.status-pill--warn {
  border-color: hsl(var(--warning) / 0.25);
  background: hsl(var(--warning-subtle));
  color: hsl(38 88% 38%);
}
.status-pill--info {
  border-color: hsl(var(--info) / 0.25);
  background: hsl(var(--info-subtle));
  color: hsl(202 80% 40%);
}

/* ---- 状态圆点 ---- */
.status-dot {
  display: inline-block;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 9999px;
  flex-shrink: 0;
}
.status-dot--ok { background: hsl(var(--success)); box-shadow: 0 0 6px hsl(var(--success) / 0.3); }
.status-dot--danger { background: hsl(var(--danger)); box-shadow: 0 0 6px hsl(var(--danger) / 0.3); }
.status-dot--warn { background: hsl(var(--warning)); box-shadow: 0 0 6px hsl(var(--warning) / 0.3); }
.status-dot--idle { background: hsl(220 10% 70%); }

/* ---- 主操作按钮 v3 — 渐变、hover 上浮 ---- */
.btn-primary {
  background: linear-gradient(180deg, hsl(var(--accent-primary)), hsl(var(--primary)));
  color: hsl(var(--primary-foreground));
  font-weight: 600;
  border-radius: var(--radius);
  box-shadow: var(--shadow-glow), inset 0 1px 0 hsl(0 0% 100% / 0.2);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  border: none;
}
.btn-primary:hover {
  background: linear-gradient(180deg, hsl(192 76% 50%), hsl(var(--primary-hover)));
  box-shadow: var(--shadow-glow-strong), inset 0 1px 0 hsl(0 0% 100% / 0.25);
  transform: translateY(-1px);
}

/* ---- 次要按钮 ---- */
.btn-secondary {
  background: hsl(var(--secondary));
  color: hsl(var(--secondary-foreground));
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid hsl(var(--border));
  box-shadow: var(--shadow-soft);
  transition: all 0.2s ease;
}
.btn-secondary:hover {
  background: hsl(220 20% 92%);
  border-color: hsl(var(--border-strong));
}

/* ---- 急停按钮 v3 ---- */
.btn-estop {
  background: linear-gradient(180deg, hsl(4 72% 54%), hsl(var(--danger)));
  color: hsl(var(--danger-foreground));
  font-weight: 700;
  border-radius: var(--radius);
  box-shadow: 0 2px 12px -2px hsl(var(--danger) / 0.3), inset 0 1px 0 hsl(0 0% 100% / 0.2);
  transition: all 0.15s ease;
  border: none;
}
.btn-estop:hover {
  background: linear-gradient(180deg, hsl(4 72% 58%), hsl(4 72% 46%));
  box-shadow: 0 4px 18px -2px hsl(var(--danger) / 0.4), inset 0 1px 0 hsl(0 0% 100% / 0.25);
  transform: translateY(-1px);
}

/* ---- 等宽数据显示 ---- */
.data-mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* ---- 分段控制 v3 — 胶囊形 ---- */
.segmented {
  display: grid;
  gap: 0.25rem;
  padding: 0.25rem;
  border-radius: var(--radius);
  background: hsl(220 20% 93%);
  border: 1px solid hsl(var(--border));
}
.segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.25rem;
  padding: 0 0.875rem;
  border-radius: calc(var(--radius) - 4px);
  font-size: var(--text-sm);
  font-weight: 500;
  color: hsl(var(--muted-foreground));
  transition: all 0.2s ease;
  cursor: pointer;
  border: none;
  background: transparent;
}
.segmented__item--active {
  background: hsl(0 0% 100%);
  color: hsl(var(--primary));
  box-shadow: var(--shadow-soft);
}

/* ---- 输入框 v3 ---- */
.field-input {
  height: 2.5rem;
  border-radius: var(--radius);
  border: 1px solid hsl(var(--border));
  background: hsl(0 0% 100%);
  color: hsl(var(--foreground));
  padding: 0 0.75rem;
  font-size: var(--text-sm);
  transition: all 0.2s ease;
  outline: none;
  box-shadow: var(--shadow-sm);
}
.field-input:focus {
  border-color: hsl(var(--accent-primary) / 0.5);
  box-shadow: 0 0 0 3px hsl(var(--accent-primary) / 0.12);
}
.field-input::placeholder {
  color: hsl(var(--muted-foreground) / 0.7);
}

/* ===================================================================
   动效系统 v3 — 柔和克制
   =================================================================== */

@keyframes run-pulse-dot {
  0%, 100% { transform: scale(0.92); opacity: 0.8; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes run-pulse-ring {
  0% { transform: scale(0.5); opacity: 0.25; }
  100% { transform: scale(1.4); opacity: 0; }
}
.run-pulse {
  position: relative;
  display: inline-block;
  width: 0.4375rem;
  height: 0.4375rem;
}
.run-pulse__dot {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--primary));
  animation: run-pulse-dot 2s ease-in-out infinite;
}
.run-pulse__ring {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--primary) / 0.18);
  animation: run-pulse-ring 2s ease-out infinite;
}

@keyframes preflight-pulse {
  0% { transform: scale(0.7); opacity: 0.5; }
  100% { transform: scale(2.6); opacity: 0; }
}
.preflight-pulse-ring {
  animation: preflight-pulse 2.2s ease-out infinite;
}

@keyframes goal-glow-breathe {
  0%, 100% {
    filter: drop-shadow(0 0 8px hsl(192 76% 46% / 0.2))
      drop-shadow(0 0 20px hsl(192 72% 40% / 0.1));
  }
  50% {
    filter: drop-shadow(0 0 14px hsl(192 80% 52% / 0.3))
      drop-shadow(0 0 30px hsl(192 76% 46% / 0.16));
  }
}
.goal-glow {
  animation: goal-glow-breathe 5.5s ease-in-out infinite;
}

@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-up {
  animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-fade-in {
  animation: fade-in 0.4s ease-out both;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
