    <title>设置 — NanoBot 机械手智能控制系统</title>
    <style id="theme-vars">
/* ===================================================================
   NanoBot 机械手智能控制系统 — 统一设计规范
   Design Tokens (基于 webui 真实 globals.css 提炼强化)
   深色工业科技主题：深海军蓝底色 + 青色强调
   =================================================================== */

:root {
  color-scheme: dark;

  /* ---- 基础色板 (HSL) ---- */
  --background: 220 20% 8%;          /* #0f1419 深海军蓝炭灰 */
  --background-elevated: 220 18% 10%; /* #141a24 抬升层 */
  --foreground: 210 15% 92%;          /* #e8edef 主文字 */
  --foreground-muted: 215 12% 58%;    /* #8a93a3 次要文字 */

  --card: 220 18% 11%;                /* #161c26 卡片底 */
  --card-foreground: 210 15% 92%;

  --popover: 220 18% 12%;
  --popover-foreground: 210 15% 92%;

  /* ---- 主品牌色 (青色 Cyan-Teal) ---- */
  --primary: 185 72% 46%;             /* #22a7b8 主操作色 */
  --primary-foreground: 220 20% 8%;
  --primary-hover: 185 72% 40%;
  --primary-subtle: 185 60% 18%;      /* 强调底色 */
  --accent-primary: 185 80% 45%;      /* 高亮强调 */
  --accent-primary-foreground: 185 80% 94%;

  /* ---- 语义状态色 ---- */
  --success: 152 56% 46%;             /* #34b578 正常/在线 */
  --success-foreground: 0 0% 100%;
  --success-subtle: 152 50% 16%;
  --warning: 38 92% 50%;              /* #f0a826 暂停/注意 */
  --warning-foreground: 38 92% 10%;
  --warning-subtle: 38 60% 16%;
  --danger: 0 72% 50%;                /* #db3838 急停/报警 */
  --danger-foreground: 0 0% 100%;
  --danger-subtle: 0 50% 16%;
  --info: 199 89% 52%;                /* #2196d4 信息提示 */
  --info-foreground: 0 0% 100%;
  --info-subtle: 199 50% 16%;

  /* ---- 中性层 ---- */
  --secondary: 220 16% 14%;           /* #1f2632 次要按钮 */
  --secondary-foreground: 210 15% 92%;
  --muted: 220 16% 14%;
  --muted-foreground: 215 12% 52%;
  --accent: 185 60% 18%;
  --accent-foreground: 210 15% 92%;

  --destructive: 0 72% 42%;
  --destructive-foreground: 0 0% 98%;

  --border: 215 14% 20%;              /* #2d3647 边框 */
  --border-strong: 215 14% 26%;
  --input: 215 14% 20%;
  --ring: 185 72% 46%;

  --sidebar: 220 20% 7%;              /* #0d1219 侧边栏 */
  --sidebar-foreground: 210 15% 92%;
  --sidebar-accent: 220 16% 15%;
  --sidebar-accent-foreground: 210 15% 92%;
  --sidebar-border: 215 14% 16%;

  /* ---- 字体系统 ---- */
  --font-sans: "Inter", "system-ui", "-apple-system", "BlinkMacSystemFont",
    "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code",
    "Source Code Pro", "Consolas", monospace;

  /* 字号阶梯 */
  --text-xs: 0.6875rem;   /* 11px 标签/辅助 */
  --text-sm: 0.8125rem;   /* 13px 正文小 */
  --text-base: 0.875rem;  /* 14px 正文 */
  --text-md: 1rem;        /* 16px 小标题 */
  --text-lg: 1.125rem;    /* 18px 标题 */
  --text-xl: 1.375rem;    /* 22px 大标题 */
  --text-2xl: 1.75rem;    /* 28px 页面标题 */
  --text-display: 2.25rem;/* 36px 展示标题 */

  /* ---- 圆角系统 ---- */
  --radius: 0.4375rem;     /* 7px 默认 */
  --radius-sm: 0.3125rem;  /* 5px */
  --radius-md: 0.4375rem;  /* 7px */
  --radius-lg: 0.625rem;   /* 10px */
  --radius-xl: 0.875rem;   /* 14px */

  /* ---- 间距系统 (4px 基准) ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  /* ---- 阴影系统 ---- */
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5), 0 4px 6px -4px rgb(0 0 0 / 0.4);
  --shadow-glow: 0 0 20px hsl(var(--accent-primary) / 0.2);
  --shadow-glow-strong: 0 0 28px hsl(var(--accent-primary) / 0.35);
  --shadow-card: 0 0 40px -12px hsl(var(--accent-primary) / 0.08);

  /* ---- 滚动条 ---- */
  --scrollbar-thumb: hsl(var(--muted-foreground) / 0.28);
  --scrollbar-thumb-hover: hsl(var(--muted-foreground) / 0.44);
}

/* ---- 基础重置 ---- */
* {
  border-color: hsl(var(--border));
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 工业科技网格背景 */
body {
  background-image:
    linear-gradient(hsl(var(--border) / 0.35) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--border) / 0.35) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ---- 滚动条 ---- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background-color: var(--scrollbar-thumb);
  border-radius: 9999px;
}
*::-webkit-scrollbar-thumb:hover {
  background-color: var(--scrollbar-thumb-hover);
}

::selection {
  background: hsl(var(--primary) / 0.2);
}

/* ===================================================================
   组件层 — 工业控制 UI 通用样式
   =================================================================== */

/* ---- 玻璃拟态卡片 ---- */
.glass-card {
  background: hsl(220 18% 9% / 0.75);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid hsl(var(--accent-primary) / 0.15);
  box-shadow: var(--shadow-card);
}

/* ---- 状态指示药丸 ---- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.125rem 0.5rem;
  border-radius: var(--radius-sm);
  border: 1px solid;
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}
.status-pill--ok {
  border-color: hsl(var(--success) / 0.3);
  background: hsl(var(--success) / 0.1);
  color: hsl(var(--success) / 0.9);
}
.status-pill--danger {
  border-color: hsl(var(--danger) / 0.3);
  background: hsl(var(--danger) / 0.1);
  color: hsl(0 72% 60%);
}
.status-pill--warn {
  border-color: hsl(var(--warning) / 0.3);
  background: hsl(var(--warning) / 0.1);
  color: hsl(38 92% 60%);
}
.status-pill--info {
  border-color: hsl(var(--info) / 0.3);
  background: hsl(var(--info) / 0.1);
  color: hsl(199 89% 62%);
}

/* ---- 状态圆点 ---- */
.status-dot {
  display: inline-block;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 9999px;
  flex-shrink: 0;
}
.status-dot--ok { background: hsl(var(--success)); box-shadow: 0 0 6px hsl(var(--success) / 0.4); }
.status-dot--danger { background: hsl(var(--danger)); box-shadow: 0 0 6px hsl(var(--danger) / 0.4); }
.status-dot--warn { background: hsl(var(--warning)); box-shadow: 0 0 6px hsl(var(--warning) / 0.4); }
.status-dot--idle { background: hsl(var(--muted-foreground) / 0.5); }

/* ---- 主操作按钮 ---- */
.btn-primary {
  background: hsl(var(--primary));
  color: hsl(var(--primary-foreground));
  font-weight: 600;
  border-radius: var(--radius);
  box-shadow: var(--shadow-glow);
  transition: all 0.2s ease;
}
.btn-primary:hover {
  background: hsl(var(--primary-hover));
  box-shadow: var(--shadow-glow-strong);
}

/* ---- 急停按钮 ---- */
.btn-estop {
  background: hsl(var(--danger));
  color: hsl(var(--danger-foreground));
  font-weight: 700;
  border-radius: var(--radius);
  box-shadow: 0 0 16px hsl(var(--danger) / 0.3);
  transition: all 0.15s ease;
}
.btn-estop:hover {
  background: hsl(0 72% 45%);
  box-shadow: 0 0 24px hsl(var(--danger) / 0.5);
}

/* ---- 等宽数据显示 ---- */
.data-mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* ---- 分段控制 ---- */
.segmented {
  display: grid;
  gap: 0.25rem;
  padding: 0.25rem;
  border-radius: var(--radius);
  background: hsl(220 16% 12% / 0.5);
  border: 1px solid hsl(var(--border) / 0.2);
}
.segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.25rem;
  padding: 0 0.75rem;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: 500;
  color: hsl(var(--muted-foreground));
  transition: all 0.2s ease;
  cursor: pointer;
  border: none;
  background: transparent;
}
.segmented__item--active {
  background: hsl(var(--accent-primary) / 0.15);
  color: hsl(var(--accent-primary-foreground));
  box-shadow: 0 0 12px hsl(var(--accent-primary) / 0.12);
}

/* ===================================================================
   动效系统
   =================================================================== */

/* 运行脉冲 */
@keyframes run-pulse-dot {
  0%, 100% { transform: scale(0.9); opacity: 0.76; }
  50% { transform: scale(1.08); opacity: 1; }
}
@keyframes run-pulse-ring {
  0% { transform: scale(0.42); opacity: 0.34; }
  100% { transform: scale(1.28); opacity: 0; }
}
.run-pulse {
  position: relative;
  display: inline-block;
  width: 0.375rem;
  height: 0.375rem;
}
.run-pulse__dot {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--accent-primary));
  animation: run-pulse-dot 1.55s ease-in-out infinite;
}
.run-pulse__ring {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--accent-primary) / 0.22);
  animation: run-pulse-ring 1.55s ease-out infinite;
}

/* 预检脉冲 (琥珀色) */
@keyframes preflight-pulse {
  0% { transform: scale(0.7); opacity: 0.7; }
  100% { transform: scale(2.4); opacity: 0; }
}
.preflight-pulse-ring {
  animation: preflight-pulse 1.8s ease-out infinite;
}

/* 流式文本光泽 */
@keyframes streaming-text-sheen-ltr {
  0% { background-position: 140% 50%; }
  100% { background-position: -40% 50%; }
}

/* 目标辉光呼吸 */
@keyframes goal-glow-breathe {
  0%, 100% {
    filter: drop-shadow(0 0 12px hsl(198 90% 72% / 0.28))
      drop-shadow(0 0 28px hsl(195 95% 65% / 0.16));
  }
  50% {
    filter: drop-shadow(0 0 20px hsl(198 95% 78% / 0.42))
      drop-shadow(0 0 42px hsl(195 100% 70% / 0.24));
  }
}
.goal-glow {
  animation: goal-glow-breathe 4.8s ease-in-out infinite;
}

/* 入场动画 */
@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-up {
  animation: fade-in-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-fade-in {
  animation: fade-in 0.3s ease-out both;
}

/* 扫描线 */
@keyframes scan-line {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}

/* ---- 无障碍：减少动效 ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
