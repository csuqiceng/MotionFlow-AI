<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 机械手控制系统 v2</title>
    <style id="theme-vars">
/* ===================================================================
   NanoBot 机械手智能控制系统 — 统一设计规范 v2 (Refined)
   柔和精致工业风：大圆角 · 柔光 · 毛玻璃 · 克制动效
   =================================================================== */

:root {
  color-scheme: dark;

  /* ---- 基础色板 (HSL) — 提亮 1-2 阶，减少压抑感 ---- */
  --background: 225 18% 10%;          /* #151a26 更柔和的深蓝灰 */
  --background-elevated: 225 16% 13%; /* #1b2130 抬升层 */
  --foreground: 215 20% 94%;          /* #eef1f6 主文字，更亮 */
  --foreground-muted: 218 12% 62%;    /* #9298aa 次要文字 */

  --card: 225 16% 13%;                /* #1b2130 卡片底 */
  --card-foreground: 215 20% 94%;

  --popover: 225 16% 15%;
  --popover-foreground: 215 20% 94%;

  /* ---- 主品牌色 (青蓝 Cyan-Teal) — 稍偏蓝，更沉稳 ---- */
  --primary: 190 68% 48%;             /* #27b0c4 主操作色 */
  --primary-foreground: 225 25% 10%;
  --primary-hover: 190 68% 42%;
  --primary-subtle: 190 50% 20%;
  --accent-primary: 190 78% 56%;      /* #3fc4d8 高亮强调 */
  --accent-primary-foreground: 190 80% 96%;

  /* ---- 语义状态色 — 柔化饱和度 ---- */
  --success: 156 52% 48%;             /* #38b88a 正常/在线 */
  --success-foreground: 0 0% 100%;
  --success-subtle: 156 45% 18%;
  --warning: 40 88% 54%;              /* #f0a93a 暂停/注意 */
  --warning-foreground: 40 88% 12%;
  --warning-subtle: 40 55% 18%;
  --danger: 4 70% 54%;                /* #db4747 急停/报警 */
  --danger-foreground: 0 0% 100%;
  --danger-subtle: 4 48% 18%;
  --info: 202 84% 56%;                /* #3ca5e8 信息提示 */
  --info-foreground: 0 0% 100%;
  --info-subtle: 202 48% 18%;

  /* ---- 中性层 ---- */
  --secondary: 225 14% 17%;           /* #232a3a 次要按钮 */
  --secondary-foreground: 215 20% 94%;
  --muted: 225 14% 16%;
  --muted-foreground: 218 12% 56%;
  --accent: 190 50% 20%;
  --accent-foreground: 215 20% 94%;

  --destructive: 4 70% 46%;
  --destructive-foreground: 0 0% 98%;

  --border: 220 12% 22%;              /* #323a4d 边框，柔化 */
  --border-strong: 220 12% 28%;
  --input: 220 12% 22%;
  --ring: 190 68% 48%;

  --sidebar: 225 20% 9%;              /* #131825 侧边栏 */
  --sidebar-foreground: 215 20% 94%;
  --sidebar-accent: 225 14% 18%;
  --sidebar-accent-foreground: 215 20% 94%;
  --sidebar-border: 220 12% 18%;

  /* ---- 字体系统 ---- */
  --font-sans: "Inter", "system-ui", "-apple-system", "BlinkMacSystemFont",
    "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code",
    "Source Code Pro", "Consolas", monospace;

  /* 字号阶梯 */
  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.875rem;
  --text-md: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-display: 2.25rem;

  /* ---- 圆角系统 v2 — 全面放大，柔和精致 ---- */
  --radius: 0.75rem;       /* 12px 默认 */
  --radius-sm: 0.5rem;     /* 8px */
  --radius-md: 0.75rem;    /* 12px */
  --radius-lg: 1rem;       /* 16px */
  --radius-xl: 1.25rem;    /* 20px */
  --radius-2xl: 1.5rem;    /* 24px 大卡片 */

  /* ---- 间距系统 (4px 基准) ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  /* ---- 阴影系统 v2 — 更柔和、弥散、多层次 ---- */
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.12);
  --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.18), 0 2px 6px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 12px 28px -6px rgb(0 0 0 / 0.28), 0 6px 12px -4px rgb(0 0 0 / 0.14);
  --shadow-glow: 0 4px 16px -2px hsl(var(--accent-primary) / 0.25);
  --shadow-glow-strong: 0 6px 24px -2px hsl(var(--accent-primary) / 0.4);
  --shadow-card: 0 8px 32px -8px rgb(0 0 0 / 0.24);
  --shadow-soft: 0 2px 8px -1px rgb(0 0 0 / 0.1);

  /* ---- 滚动条 ---- */
  --scrollbar-thumb: hsl(var(--muted-foreground) / 0.25);
  --scrollbar-thumb-hover: hsl(var(--muted-foreground) / 0.4);
}

/* ---- 基础重置 ---- */
* {
  border-color: hsl(var(--border));
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background-color: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* v2 背景：柔和径向辉光 + 极淡网格，取代硬朗网格 */
body {
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, hsl(var(--accent-primary) / 0.06), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, hsl(190 50% 40% / 0.05), transparent),
    linear-gradient(hsl(var(--border) / 0.12) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--border) / 0.12) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 56px 56px, 56px 56px;
  background-attachment: fixed;
}

/* ---- 滚动条 ---- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background-color: var(--scrollbar-thumb);
  border-radius: 9999px;
}
*::-webkit-scrollbar-thumb:hover {
  background-color: var(--scrollbar-thumb-hover);
}

::selection {
  background: hsl(var(--primary) / 0.22);
}

/* ===================================================================
   组件层 v2 — 柔和精致工业控制 UI
   =================================================================== */

/* ---- 毛玻璃卡片 v2 — 更柔和的模糊 + 内高光 ---- */
.glass-card {
  background: linear-gradient(180deg, hsl(225 16% 15% / 0.72), hsl(225 16% 12% / 0.72));
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  border: 1px solid hsl(215 20% 100% / 0.06);
  box-shadow: var(--shadow-card), inset 0 1px 0 hsl(215 20% 100% / 0.04);
  border-radius: var(--radius-lg);
}

/* ---- 柔和卡片（非玻璃） ---- */
.soft-card {
  background: hsl(var(--card));
  border: 1px solid hsl(var(--border) / 0.6);
  box-shadow: var(--shadow-soft);
  border-radius: var(--radius-lg);
}

/* ---- 状态指示药丸 v2 — 胶囊形，柔光底 ---- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.1875rem 0.625rem;
  border-radius: 9999px;
  border: 1px solid;
  font-size: var(--text-xs);
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}
.status-pill--ok {
  border-color: hsl(var(--success) / 0.25);
  background: hsl(var(--success) / 0.08);
  color: hsl(var(--success) / 0.95);
}
.status-pill--danger {
  border-color: hsl(var(--danger) / 0.25);
  background: hsl(var(--danger) / 0.08);
  color: hsl(4 70% 64%);
}
.status-pill--warn {
  border-color: hsl(var(--warning) / 0.25);
  background: hsl(var(--warning) / 0.08);
  color: hsl(40 88% 64%);
}
.status-pill--info {
  border-color: hsl(var(--info) / 0.25);
  background: hsl(var(--info) / 0.08);
  color: hsl(202 84% 66%);
}

/* ---- 状态圆点 v2 — 更柔和的辉光 ---- */
.status-dot {
  display: inline-block;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 9999px;
  flex-shrink: 0;
}
.status-dot--ok { background: hsl(var(--success)); box-shadow: 0 0 8px hsl(var(--success) / 0.5); }
.status-dot--danger { background: hsl(var(--danger)); box-shadow: 0 0 8px hsl(var(--danger) / 0.5); }
.status-dot--warn { background: hsl(var(--warning)); box-shadow: 0 0 8px hsl(var(--warning) / 0.5); }
.status-dot--idle { background: hsl(var(--muted-foreground) / 0.45); }

/* ---- 主操作按钮 v2 — 柔光、大圆角、渐变 ---- */
.btn-primary {
  background: linear-gradient(180deg, hsl(var(--accent-primary)), hsl(var(--primary)));
  color: hsl(var(--primary-foreground));
  font-weight: 600;
  border-radius: var(--radius);
  box-shadow: var(--shadow-glow), inset 0 1px 0 hsl(215 20% 100% / 0.15);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  border: none;
}
.btn-primary:hover {
  background: linear-gradient(180deg, hsl(190 78% 60%), hsl(var(--primary-hover)));
  box-shadow: var(--shadow-glow-strong), inset 0 1px 0 hsl(215 20% 100% / 0.2);
  transform: translateY(-1px);
}

/* ---- 次要按钮 v2 ---- */
.btn-secondary {
  background: hsl(var(--secondary));
  color: hsl(var(--secondary-foreground));
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid hsl(var(--border) / 0.6);
  box-shadow: var(--shadow-soft);
  transition: all 0.2s ease;
}
.btn-secondary:hover {
  background: hsl(225 14% 20%);
  border-color: hsl(var(--border-strong));
}

/* ---- 急停按钮 v2 — 保持醒目但更精致 ---- */
.btn-estop {
  background: linear-gradient(180deg, hsl(4 70% 58%), hsl(var(--danger)));
  color: hsl(var(--danger-foreground));
  font-weight: 700;
  border-radius: var(--radius);
  box-shadow: 0 4px 16px -2px hsl(var(--danger) / 0.35), inset 0 1px 0 hsl(0 0% 100% / 0.15);
  transition: all 0.15s ease;
  border: none;
}
.btn-estop:hover {
  background: linear-gradient(180deg, hsl(4 70% 62%), hsl(4 70% 50%));
  box-shadow: 0 6px 24px -2px hsl(var(--danger) / 0.5), inset 0 1px 0 hsl(0 0% 100% / 0.2);
  transform: translateY(-1px);
}

/* ---- 等宽数据显示 ---- */
.data-mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* ---- 分段控制 v2 — 胶囊形 ---- */
.segmented {
  display: grid;
  gap: 0.25rem;
  padding: 0.25rem;
  border-radius: var(--radius);
  background: hsl(225 14% 14% / 0.6);
  border: 1px solid hsl(var(--border) / 0.4);
}
.segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2.25rem;
  padding: 0 0.875rem;
  border-radius: calc(var(--radius) - 4px);
  font-size: var(--text-sm);
  font-weight: 500;
  color: hsl(var(--muted-foreground));
  transition: all 0.2s ease;
  cursor: pointer;
  border: none;
  background: transparent;
}
.segmented__item--active {
  background: linear-gradient(180deg, hsl(var(--accent-primary) / 0.2), hsl(var(--accent-primary) / 0.12));
  color: hsl(var(--accent-primary-foreground));
  box-shadow: var(--shadow-glow), inset 0 1px 0 hsl(215 20% 100% / 0.06);
}

/* ---- 输入框 v2 — 更大圆角、柔光 ---- */
.field-input {
  height: 2.5rem;
  border-radius: var(--radius);
  border: 1px solid hsl(var(--border) / 0.6);
  background: hsl(225 16% 10% / 0.5);
  color: hsl(var(--foreground));
  padding: 0 0.75rem;
  font-size: var(--text-sm);
  transition: all 0.2s ease;
  outline: none;
}
.field-input:focus {
  border-color: hsl(var(--accent-primary) / 0.5);
  box-shadow: 0 0 0 3px hsl(var(--accent-primary) / 0.12);
  background: hsl(225 16% 10% / 0.7);
}
.field-input::placeholder {
  color: hsl(var(--muted-foreground) / 0.7);
}

/* ===================================================================
   动效系统 v2 — 更柔和、更克制
   =================================================================== */

/* 运行脉冲 — 放慢、柔化 */
@keyframes run-pulse-dot {
  0%, 100% { transform: scale(0.92); opacity: 0.8; }
  50% { transform: scale(1.06); opacity: 1; }
}
@keyframes run-pulse-ring {
  0% { transform: scale(0.5); opacity: 0.3; }
  100% { transform: scale(1.4); opacity: 0; }
}
.run-pulse {
  position: relative;
  display: inline-block;
  width: 0.4375rem;
  height: 0.4375rem;
}
.run-pulse__dot {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--accent-primary));
  animation: run-pulse-dot 2s ease-in-out infinite;
}
.run-pulse__ring {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: hsl(var(--accent-primary) / 0.2);
  animation: run-pulse-ring 2s ease-out infinite;
}

/* 预检脉冲 — 更慢更柔 */
@keyframes preflight-pulse {
  0% { transform: scale(0.7); opacity: 0.6; }
  100% { transform: scale(2.6); opacity: 0; }
}
.preflight-pulse-ring {
  animation: preflight-pulse 2.2s ease-out infinite;
}

/* 流式文本光泽 */
@keyframes streaming-text-sheen-ltr {
  0% { background-position: 140% 50%; }
  100% { background-position: -40% 50%; }
}

/* 目标辉光呼吸 — 柔化 */
@keyframes goal-glow-breathe {
  0%, 100% {
    filter: drop-shadow(0 0 10px hsl(190 80% 60% / 0.22))
      drop-shadow(0 0 24px hsl(190 80% 55% / 0.12));
  }
  50% {
    filter: drop-shadow(0 0 16px hsl(190 85% 66% / 0.34))
      drop-shadow(0 0 36px hsl(190 80% 60% / 0.18));
  }
}
.goal-glow {
  animation: goal-glow-breathe 5.5s ease-in-out infinite;
}

/* 入场动画 — 更慢更柔 */
@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-up {
  animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
.animate-fade-in {
  animation: fade-in 0.4s ease-out both;
}

/* 扫描线 */
@keyframes scan-line {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100vh); }
}

/* ---- 无障碍：减少动效 ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

      .text-destructive-foreground { color: var(--destructive-foreground); }
      .border-destructive-foreground { border-color: var(--destructive-foreground); }
      .ring-destructive-foreground { --tw-ring-color: var(--destructive-foreground); }
      .bg-border { background-color: var(--border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--border); }
      .ring-border { --tw-ring-color: var(--border); }
      .bg-input { background-color: var(--input); }
      .text-input { color: var(--input); }
      .border-input { border-color: var(--input); }
      .ring-input { --tw-ring-color: var(--input); }
      .bg-ring { background-color: var(--ring); }
      .text-ring { color: var(--ring); }
      .border-ring { border-color: var(--ring); }
      .ring-ring { --tw-ring-color: var(--ring); }
      .bg-sidebar { background-color: var(--sidebar); }
      .text-sidebar { color: var(--sidebar); }
      .border-sidebar { border-color: var(--sidebar); }
      .ring-sidebar { --tw-ring-color: var(--sidebar); }
      .bg-sidebar-foreground { background-color: var(--sidebar-foreground); }
      .text-sidebar-foreground { color: var(--sidebar-foreground); }
      .border-sidebar-foreground { border-color: var(--sidebar-foreground); }
      .ring-sidebar-foreground { --tw-ring-color: var(--sidebar-foreground); }
      .bg-sidebar-accent { background-color: var(--sidebar-accent); }
      .text-sidebar-accent { color: var(--sidebar-accent); }
      .border-sidebar-accent { border-color: var(--sidebar-accent); }
      .ring-sidebar-accent { --tw-ring-color: var(--sidebar-accent); }
      .bg-sidebar-accent-foreground { background-color: var(--sidebar-accent-foreground); }
      .text-sidebar-accent-foreground { color: var(--sidebar-accent-foreground); }
      .border-sidebar-accent-foreground { border-color: var(--sidebar-accent-foreground); }
      .ring-sidebar-accent-foreground { --tw-ring-color: var(--sidebar-accent-foreground); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

<body class="font-sans">
  <main class="min-h-screen w-full grid lg:grid-cols-[1.05fr_1fr]">

    <!-- ============ 左侧品牌视觉区（lg+ 显示） ============ -->
    <section class="relative hidden lg:flex flex-col justify-between overflow-hidden p-8">
      <!-- 背景图（大圆角面板） -->
      <div class="absolute inset-8 overflow-hidden rounded-2xl">
        <img
          src="../assets/login-visual.jpg"
          alt="NanoBot 机械臂线框徽标"
          class="absolute inset-0 h-full w-full object-cover"
        />
        <div class="absolute inset-0 brand-veil"></div>
      </div>

      <!-- 顶部品牌标 -->
      <div class="relative z-10 flex items-center gap-2.5">
        <span class="brand-dot h-2.5 w-2.5 rounded-full bg-accent-primary"></span>
        <span class="font-mono text-sm font-semibold tracking-[0.2em] text-foreground/90">NANOBOT</span>
        <span class="ml-2 font-mono text-[11px] uppercase tracking-widest text-muted-foreground">
          // industrial robotics
        </span>
      </div>

      <!-- 中部标语 -->
      <div class="relative z-10 max-w-md animate-fade-in-up">
        <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-accent-primary/20 bg-accent-primary/5 px-3 py-1">
          <i data-lucide="shield-check" class="h-3.5 w-3.5 text-accent-primary"></i>
          <span class="font-mono text-[11px] uppercase tracking-wider text-accent-primary-foreground/80">
            ISO 10218 Compliant
          </span>
        </div>
        <h2 class="font-sans text-4xl font-bold leading-[1.1] text-foreground">
          Precision<br />
          <span class="text-accent-primary">Robotics</span><br />
          Intelligence
        </h2>
        <p class="mt-4 max-w-sm text-sm leading-relaxed text-muted-foreground">
          工业级机械臂智能操作系统，融合语音指令、AI 视觉与实时运动控制，为操作员与工程师提供统一的精准操控体验。
        </p>
      </div>

      <!-- 底部版本数据条 -->
      <div class="relative z-10 flex items-center justify-between border-t border-border/30 pt-5">
        <div class="flex items-center gap-5 font-mono text-[11px] uppercase tracking-wider text-muted-foreground">
          <span class="flex items-center gap-1.5">
            <span class="status-dot status-dot--ok"></span> SYS ONLINE
          </span>
          <span>FW 4.18.2</span>
          <span class="hidden xl:inline">DOF 6</span>
        </div>
        <div class="font-mono text-[11px] text-muted-foreground">© NanoBot Robotics</div>
      </div>
    </section>

    <!-- ============ 右侧登录卡片区 ============ -->
    <section class="relative flex items-center justify-center p-6 sm:p-10">
      <!-- 移动端顶部小标（lg 隐藏） -->
      <div class="absolute left-6 top-6 flex items-center gap-2 lg:hidden">
        <span class="brand-dot h-2.5 w-2.5 rounded-full bg-accent-primary"></span>
        <span class="font-mono text-sm font-semibold tracking-[0.2em] text-foreground/90">NANOBOT</span>
      </div>

      <!-- 毛玻璃登录卡片 -->
      <div class="glass-card login-card animate-fade-in-up w-full max-w-md rounded-2xl p-8">
        <!-- 1. 品牌标题区 -->
        <div class="text-center">
          <div class="mb-3 flex justify-center">
            <span class="brand-dot h-2.5 w-2.5 rounded-full bg-accent-primary"></span>
          </div>
          <h1 class="text-2xl font-bold text-foreground">机械手控制系统</h1>
          <p class="mt-1.5 text-sm text-muted-foreground">选择身份并输入凭据</p>
        </div>

        <!-- 2. 控制器连接预检区 -->
        <div class="mt-6 border-t border-border/40 pt-6">
          <!-- 标签 -->
          <div class="mb-2.5 flex items-center gap-1.5">
            <i data-lucide="cpu" class="h-3.5 w-3.5 text-muted-foreground"></i>
            <span class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">
              控制器连接
            </span>
          </div>

          <!-- 地址输入 + 检测按钮 -->
          <div class="flex gap-2">
            <input
              type="text"
              class="field-input data-mono flex-1"
              placeholder="10.168.3.21"
              value="10.168.3.21"
              aria-label="控制器地址"
            />
            <button type="button" class="btn-outline">
              <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
              检测连接
            </button>
          </div>

          <!-- 健康状态行 -->
          <div class="mt-2.5 flex items-center justify-between rounded-lg border border-success/20 bg-success/5 px-3 py-2">
            <div class="flex items-center gap-2">
              <span class="status-dot status-dot--ok"></span>
              <span class="text-xs font-medium text-foreground">控制器可达</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-mono text-[11px] text-muted-foreground">延迟</span>
              <span class="data-mono text-xs font-semibold text-success">12ms</span>
            </div>
          </div>

          <!-- 语音 / AI 服务芯片 -->
          <div class="mt-2 grid grid-cols-2 gap-2">
            <div class="svc-chip">
              <span class="status-dot status-dot--ok"></span>
              <i data-lucide="mic" class="h-3.5 w-3.5 text-success"></i>
              <span class="text-foreground/80">语音服务</span>
              <span class="data-mono ml-auto text-[11px] font-semibold text-success">12ms</span>
            </div>
            <div class="svc-chip">
              <span class="status-dot status-dot--ok"></span>
              <i data-lucide="cpu" class="h-3.5 w-3.5 text-success"></i>
              <span class="text-foreground/80">AI 服务</span>
              <span class="data-mono ml-auto text-[11px] font-semibold text-success">8ms</span>
            </div>
          </div>
        </div>

        <!-- 3. 角色分段控制 -->
        <div class="mt-5">
          <div class="segmented grid-cols-2">
            <button class="segmented__item segmented__item--active" type="button">
              <i data-lucide="user" class="mr-1.5 h-3.5 w-3.5"></i>
              操作员
            </button>
            <button class="segmented__item" type="button">
              <i data-lucide="user" class="mr-1.5 h-3.5 w-3.5"></i>
              工程师
            </button>
          </div>
        </div>

        <!-- 4. 用户名 -->
        <div class="mt-5">
          <label class="mb-1.5 block text-xs font-medium text-muted-foreground" for="username">
            用户名
          </label>
          <div class="relative">
            <i data-lucide="user" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
            <input
              id="username"
              type="text"
              class="field-input pl-9 w-full"
              placeholder="用户名"
              value="operator"
              autocomplete="username"
            />
          </div>
        </div>

        <!-- 5. 密码 -->
        <div class="mt-3">
          <label class="mb-1.5 block text-xs font-medium text-muted-foreground" for="password">
            密码
          </label>
          <div class="relative">
            <i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
            <input
              id="password"
              type="password"
              class="field-input pl-9 w-full"
              placeholder="密码"
              autocomplete="current-password"
            />
          </div>
        </div>

        <!-- 6. 登录按钮 -->
        <button class="btn-primary mt-6 flex h-10 w-full items-center justify-center gap-2" type="submit">
          <i data-lucide="log-in" class="h-4 w-4"></i>
          登录
        </button>

        <!-- 7. 底部版本号 -->
        <div class="mt-5 flex items-center justify-center gap-2 text-muted-foreground">
          <span class="status-dot status-dot--ok" style="width:0.375rem;height:0.375rem"></span>
          <span class="data-mono text-xs">v2.1.0</span>
          <span class="text-xs text-muted-foreground/60">·</span>
          <span class="font-mono text-[11px] uppercase tracking-wider text-muted-foreground/70">
            build 20260721
          </span>
        </div>
      </div>
    </section>
  </main>

  <!-- 初始化 Lucide 图标 -->
  <script>
    lucide.createIcons();
  </script>

    <style>
    /* 青色发光圆点 */
    .brand-dot {
      box-shadow: 0 0 12px hsl(var(--accent-primary) / 0.7),
                  0 0 24px hsl(var(--accent-primary) / 0.35);
    }

    /* 左侧品牌视觉遮罩 — 柔和径向渐变 */
    .brand-veil {
      background:
        radial-gradient(120% 80% at 20% 10%, hsl(190 68% 42% / 0.22) 0%, transparent 55%),
        radial-gradient(80% 60% at 80% 90%, hsl(190 78% 48% / 0.10) 0%, transparent 60%),
        linear-gradient(135deg, hsl(225 18% 8% / 0.92) 0%, hsl(225 18% 10% / 0.55) 45%, hsl(225 18% 8% / 0.90) 100%);
    }

    /* 轮廓按钮（检测连接） */
    .btn-outline {
      height: 2.5rem;
      padding: 0 0.875rem;
      border-radius: var(--radius);
      border: 1px solid hsl(var(--border) / 0.7);
      background: hsl(225 16% 13% / 0.5);
      color: hsl(var(--foreground));
      font-size: var(--text-sm);
      font-weight: 500;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      transition: all 0.2s ease;
    }
    .btn-outline:hover {
      border-color: hsl(var(--accent-primary) / 0.5);
      color: hsl(var(--accent-primary-foreground));
      background: hsl(var(--accent-primary) / 0.08);
    }

    /* 服务状态芯片 */
    .svc-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.625rem;
      border-radius: var(--radius);
      border: 1px solid hsl(var(--border) / 0.5);
      background: hsl(225 16% 12% / 0.5);
      font-size: var(--text-xs);
    }

    /* 登录卡片柔光提升（保留 glass-card 内高光） */
    .login-card {
      box-shadow: var(--shadow-card),
                  0 0 48px -12px hsl(var(--accent-primary) / 0.18),
                  inset 0 1px 0 hsl(215 20% 100% / 0.04);
    }

    /* 保证带图标的输入框左内边距（覆盖 .field-input 的 padding 简写） */
    .field-input.pl-9 { padding-left: 2.25rem; }
  </style>
</body>
</html>
